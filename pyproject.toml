[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bhq"
version = "0.1.1"
description = "Offline BloodHound JSON analyzer — attack-path queries without the GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "soloclz" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
bhq = "bhq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bhq"]
